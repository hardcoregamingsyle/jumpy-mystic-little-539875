<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thalamus HUD</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #telemetry {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            border-radius: 4px;
        }
    </style>
    <script type="module" src="https://unpkg.com/three@0.185.0/build/three.module.js"></script>
</head>
<body>
    <canvas id="renderer"></canvas>
    <div id="telemetry">PITCH: 0° | ROLL: 0° | YAW: 0°</div>
    <script type="module">

        console.log("Thalamus HUD initialized at %s", new Date().toISOString());
